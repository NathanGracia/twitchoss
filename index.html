<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>TwitchOSS</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js"></script>
  <style>
    :root {
      --bg-base:    #0e0e10;
      --border:     rgba(255,255,255,0.08);
      --accent:     #9147ff;
      --text:       #efeff1;
      --text-muted: #adadb8;
      --live:       #eb0400;
      --sidebar-w:  240px;
      --chat-w:     300px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #050506;
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      height: 100vh;
      overflow: hidden;
      position: relative;
    }

    /* Halos flous derrière l'interface, pour donner du grain au verre */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 0;
      background:
        radial-gradient(ellipse 700px 500px at 8% 0%,   rgba(145,71,255,0.30), transparent 60%),
        radial-gradient(ellipse 600px 500px at 100% 100%, rgba(0,200,255,0.16), transparent 60%),
        radial-gradient(ellipse 500px 400px at 60% 40%,  rgba(235,4,0,0.10), transparent 65%);
      pointer-events: none;
    }

    .app {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: var(--sidebar-w) 1fr var(--chat-w);
      height: 100vh;
    }

    /* ── Sidebar ── */
    .sidebar {
      background: rgba(20, 20, 26, 0.5);
      backdrop-filter: blur(20px) saturate(150%);
      -webkit-backdrop-filter: blur(20px) saturate(150%);
      border-right: 1px solid rgba(255,255,255,0.08);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .sidebar-header {
      padding: 16px 16px 12px;
      flex-shrink: 0;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logo-mark {
      width: 22px;
      height: 22px;
      border-radius: 6px;
      background: var(--accent);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 800;
      flex-shrink: 0;
    }

    .logo-text {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: -0.2px;
      color: var(--text);
    }

    /* Tabs — segmented control */
    .tabs {
      display: flex;
      gap: 3px;
      padding: 0 10px 10px;
      flex-shrink: 0;
    }

    .tab {
      flex: 1;
      padding: 6px 0;
      background: none;
      border: none;
      border-radius: 6px;
      color: var(--text-muted);
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.12s, color 0.12s;
    }

    .tab.active {
      background: rgba(255,255,255,0.08);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08);
      color: var(--text);
    }

    .tab:hover:not(.active) { color: var(--text); }

    /* Search */
    .search-wrap {
      position: relative;
      padding: 0 10px 8px;
      flex-shrink: 0;
    }

    .search-icon {
      position: absolute;
      left: 20px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      pointer-events: none;
    }

    .search-input {
      width: 100%;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 6px;
      padding: 6px 10px 6px 30px;
      color: var(--text);
      font-size: 13px;
      outline: none;
      transition: border-color 0.15s;
    }

    .search-input:focus { border-color: var(--accent); }
    .search-input::placeholder { color: var(--text-muted); }

    /* Quick watch */
    .quick-watch {
      display: flex;
      gap: 4px;
      padding: 0 10px 12px;
      border-bottom: 1px solid var(--border);
    }

    .quick-watch input {
      flex: 1;
      min-width: 0;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 6px;
      padding: 6px 10px;
      color: var(--text);
      font-size: 13px;
      outline: none;
      transition: border-color 0.15s;
    }

    .quick-watch input:focus { border-color: var(--accent); }
    .quick-watch input::placeholder { color: var(--text-muted); }

    .quick-watch button {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 6px;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 30px;
      flex-shrink: 0;
      transition: color 0.12s, background 0.12s;
    }

    .quick-watch button:hover { color: var(--accent); background: rgba(255,255,255,0.09); }

    /* Section labels */
    .section-label {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-muted);
      opacity: 0.7;
      padding: 12px 16px 4px;
    }

    /* Channel list */
    .channel-list {
      flex: 1;
      overflow-y: auto;
      padding: 2px 0 8px;
    }

    .channel-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 7px 8px 7px 12px;
      margin: 1px 6px;
      border-radius: 6px;
      border-left: 2px solid transparent;
      cursor: pointer;
      transition: background 0.1s, border-color 0.1s;
      user-select: none;
    }

    .channel-item:hover  { background: rgba(255,255,255,0.06); }
    .channel-item.active { background: rgba(255,255,255,0.08); border-left-color: var(--accent); }

    .avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 700;
      flex-shrink: 0;
      color: #fff;
      overflow: hidden;
      position: relative;
    }

    .avatar img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
    }

    .channel-item.active .avatar { box-shadow: 0 0 0 2px var(--accent); }

    .ch-info {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-width: 0;
      gap: 1px;
    }

    .ch-name {
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .ch-meta {
      font-size: 11px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .ch-viewers { opacity: 0.75; }

    .channel-item.active .ch-name { color: var(--accent); }

    .live-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--live);
      flex-shrink: 0;
      opacity: 0;
      transition: opacity 0.3s;
    }

    .live-dot.on { opacity: 1; }

    .star-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 3px 5px;
      font-size: 14px;
      line-height: 1;
      flex-shrink: 0;
      opacity: 0;
      transition: opacity 0.12s, color 0.12s;
      border-radius: 4px;
    }

    .channel-item:hover .star-btn { opacity: 1; }
    .star-btn.pinned { opacity: 1; color: var(--accent); }
    .star-btn:hover  { color: var(--accent); }

    .mp-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 3px 5px;
      line-height: 1;
      flex-shrink: 0;
      opacity: 0;
      transition: opacity 0.12s, color 0.12s;
      border-radius: 4px;
    }

    .channel-item:hover .mp-btn { opacity: 1; }
    .mp-btn.on { opacity: 1; color: var(--accent); }
    .mp-btn:hover { color: var(--accent); }

    /* ── Multiplex grid (remplace le lecteur vidéo quand l'onglet Multiplex est actif) ── */
    .multiplex-grid {
      display: none;
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 14px;
      align-content: start;
    }

    .mp-tile {
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      cursor: pointer;
      transition: border-color 0.15s, transform 0.1s;
    }

    .mp-tile:hover { border-color: var(--accent); transform: translateY(-2px); }
    .mp-tile.active { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }

    .mp-thumb-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #111;
    }

    .mp-thumb-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }

    .mp-offline {
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      color: var(--text-muted);
      font-size: 12.5px;
    }

    .mp-live-badge {
      position: absolute; top: 6px; left: 6px;
      background: var(--live);
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.3px;
      padding: 2px 6px;
      border-radius: 3px;
    }

    .mp-viewers {
      position: absolute; bottom: 6px; left: 6px;
      background: rgba(0,0,0,0.7);
      color: #fff;
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 3px;
    }

    .mp-remove {
      position: absolute; top: 6px; right: 6px;
      background: rgba(0,0,0,0.6);
      color: #fff;
      border: none;
      border-radius: 4px;
      width: 20px; height: 20px;
      font-size: 13px;
      line-height: 1;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.12s;
    }

    .mp-tile:hover .mp-remove { opacity: 1; }
    .mp-remove:hover { background: var(--live); }

    .mp-name {
      padding: 8px 10px;
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .mp-empty {
      grid-column: 1 / -1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: var(--text-muted);
      font-size: 13.5px;
      padding: 60px 20px;
      text-align: center;
    }

    .list-hint {
      padding: 10px 16px;
      font-size: 12px;
      color: var(--text-muted);
    }

    .channel-list {
      scrollbar-width: thin;
      scrollbar-color: rgba(255,255,255,0.16) transparent;
    }
    .channel-list::-webkit-scrollbar { width: 6px; }
    .channel-list::-webkit-scrollbar-track { background: transparent; }
    .channel-list::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,0.16);
      border-radius: 999px;
      border: 1.5px solid transparent;
      background-clip: padding-box;
      transition: background 0.15s;
    }
    .channel-list::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.32); }

    /* Tooltip custom (titre du stream au hover) */
    .ch-tooltip {
      position: fixed;
      z-index: 50;
      max-width: 260px;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(16px) saturate(180%);
      -webkit-backdrop-filter: blur(16px) saturate(180%);
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 8px;
      padding: 7px 11px;
      font-size: 12.5px;
      font-weight: 600;
      line-height: 1.35;
      color: var(--text);
      box-shadow: 0 10px 28px rgba(0,0,0,0.5);
      pointer-events: none;
      opacity: 0;
      transform: translate(-6px, -50%) scale(0.95);
      transition: opacity 0.1s ease, transform 0.12s ease;
    }

    .ch-tooltip.on {
      opacity: 1;
      transform: translate(0, -50%) scale(1);
    }

    .ch-tooltip-viewers {
      margin-top: 3px;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
    }

    /* ── Main ── */
    .main {
      display: flex;
      flex-direction: column;
      background: #000;
      overflow: hidden;
    }

    .player-wrapper {
      flex: 1;
      position: relative;
      background: #000;
      overflow: hidden;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: none;
    }

    .overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      background: #000;
    }

    .overlay-icon { font-size: 52px; opacity: 0.18; line-height: 1; }
    .overlay p    { font-size: 14px; color: var(--text-muted); }

    .spinner {
      width: 44px;
      height: 44px;
      border: 3px solid rgba(145, 71, 255, 0.2);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* Barre de contrôle du player — overlay en hover, par-dessus le stream */
    .player-controls {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 10;
      background: rgba(20, 20, 26, 0.55);
      backdrop-filter: blur(20px) saturate(150%);
      -webkit-backdrop-filter: blur(20px) saturate(150%);
      border-top: 1px solid rgba(255,255,255,0.08);
      padding: 0 12px;
      height: 44px;
      display: flex;
      align-items: center;
      gap: 12px;
      opacity: 0;
      transform: translateY(6px);
      transition: opacity 0.18s, transform 0.18s;
      pointer-events: none;
    }

    .player-wrapper:hover .player-controls {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    @media (hover: none) {
      .player-controls { opacity: 0.92; transform: translateY(0); pointer-events: auto; }
    }

    .player-controls-spacer { flex: 1; min-width: 0; }

    .ctrl-btn {
      background: none;
      border: none;
      color: var(--text);
      cursor: pointer;
      padding: 4px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: color 0.1s;
    }
    .ctrl-btn:hover { color: var(--accent); }
    .ctrl-btn svg   { width: 18px; height: 18px; fill: currentColor; }

    .volume-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .volume-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 80px;
      height: 4px;
      border-radius: 2px;
      background: var(--border);
      outline: none;
      cursor: pointer;
    }
    .volume-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
      transition: transform 0.1s;
    }
    .volume-slider:hover::-webkit-slider-thumb { transform: scale(1.3); }

    .separator {
      width: 1px;
      height: 20px;
      background: var(--border);
      flex-shrink: 0;
    }

    .live-badge {
      background: var(--live);
      color: #fff;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.8px;
      padding: 2px 7px;
      border-radius: 3px;
      display: none;
      flex-shrink: 0;
    }

    .live-badge.on  { display: block; }
    .info-channel   { font-size: 14px; font-weight: 700; }
    .info-title     { font-size: 12px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .info-viewers   { font-size: 12px; color: var(--text-muted); white-space: nowrap; flex-shrink: 0; }
    .info-hint      { font-size: 12px; color: var(--text-muted); }

    /* ── Chat ── */
    .chat-panel {
      background: rgba(20, 20, 26, 0.5);
      backdrop-filter: blur(20px) saturate(150%);
      -webkit-backdrop-filter: blur(20px) saturate(150%);
      border-left: 1px solid rgba(255,255,255,0.08);
      display: flex;
      flex-direction: column;
      min-height: 0;
      overflow: hidden;
    }

    .chat-header {
      padding: 0 16px;
      height: 44px;
      display: flex;
      align-items: center;
      border-bottom: 1px solid var(--border);
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      flex-shrink: 0;
    }

    #chat-messages {
      flex: 1;
      min-height: 0;
      display: none;
      flex-direction: column;
      gap: 6px;
      overflow-y: auto;
      padding: 10px 12px;
      font-size: 16px;
      line-height: 1.5;
      word-wrap: break-word;
    }

    .chat-msg { display: block; }
    .chat-msg img.emote { height: 1.6em; vertical-align: middle; margin: 0 1px; cursor: pointer; }

    #emote-tooltip {
      position: fixed;
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      padding: 12px 16px;
      background: rgba(20, 20, 26, 0.96);
      backdrop-filter: blur(20px) saturate(150%);
      -webkit-backdrop-filter: blur(20px) saturate(150%);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 12px;
      box-shadow: 0 12px 32px rgba(0,0,0,0.55);
      z-index: 9999;
      pointer-events: none;
    }
    #emote-tooltip img {
      max-width: 112px;
      max-height: 112px;
      width: auto;
      height: auto;
    }
    #emote-tooltip .emote-tooltip-name {
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
      white-space: nowrap;
      max-width: 200px;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #no-chat {
      flex: 1;
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 8px;
      color: var(--text-muted);
      font-size: 13px;
    }

    /* Debug panel */
    #debug-panel {
      display: none;
      position: absolute;
      bottom: 8px;
      left: 8px;
      background: rgba(0,0,0,0.92);
      border: 1px solid rgba(145,71,255,0.4);
      border-radius: 6px;
      padding: 10px 14px;
      font-family: monospace;
      font-size: 11px;
      color: #c9d1d9;
      z-index: 100;
      min-width: 360px;
      max-width: 520px;
      pointer-events: auto;
      user-select: text;
      line-height: 1.7;
    }
    #debug-panel.on { display: block; }
    #debug-panel b  { color: #9147ff; }
    #debug-panel .dbg-err  { color: #ff6b6b; }
    #debug-panel .dbg-ok   { color: #56d364; }
    #debug-panel .dbg-warn { color: #e3b341; }
    #debug-copy {
      margin-top: 6px;
      background: rgba(145,71,255,0.2);
      border: 1px solid rgba(145,71,255,0.4);
      border-radius: 4px;
      color: #9147ff;
      font-size: 11px;
      font-family: monospace;
      cursor: pointer;
      padding: 3px 10px;
      width: 100%;
    }
    #debug-copy:hover { background: rgba(145,71,255,0.35); }

    /* Fullscreen / cinéma — boutons inline dans .player-controls */
    .fs-btn, .cinema-btn {
      background: none;
      border: none;
      color: var(--text);
      cursor: pointer;
      padding: 4px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: color 0.1s;
    }
    .fs-btn:hover, .cinema-btn:hover { color: var(--accent); }
    .fs-btn svg, .cinema-btn svg     { width: 18px; height: 18px; }
    .cinema-btn.active { color: var(--accent); }

    /* ── Cinema mode: hide sidebar, keep chat ── */
    .app.cinema-mode {
      grid-template-columns: 0 1fr var(--chat-w);
    }
    .app.cinema-mode .sidebar {
      overflow: hidden;
      border-right: none;
      visibility: hidden;
    }

    /* Ensure video fills fullscreen properly */
    :fullscreen .player-wrapper,
    :-webkit-full-screen .player-wrapper {
      width: 100vw;
      height: 100vh;
    }
    :fullscreen video,
    :-webkit-full-screen video {
      display: block !important;
    }
  </style>
</head>
<body>
<div class="app">

  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="logo">
        <span class="logo-mark">T</span>
        <span class="logo-text">TwitchOSS</span>
      </div>
    </div>

    <div class="tabs">
      <button class="tab active" id="tab-twitch" onclick="switchTab('twitch')">Twitch</button>
      <button class="tab"        id="tab-iptv"   onclick="switchTab('iptv')">Chaînes TV</button>
      <button class="tab"        id="tab-zevent" onclick="switchTab('zevent')">ZEvent</button>
      <button class="tab"        id="tab-multiplex" onclick="switchTab('multiplex')">Multiplex</button>
    </div>

    <div class="search-wrap">
      <svg class="search-icon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input class="search-input" id="search-input" type="text" placeholder="Rechercher…" oninput="onSearch(this.value)">
    </div>

    <div class="quick-watch" id="quick-watch">
      <input id="quick-watch-input" type="text" placeholder="Chaîne Twitch…" onkeydown="if(event.key==='Enter')quickWatch(false)">
      <button onclick="quickWatch(false)" title="Regarder sans enregistrer">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <button onclick="quickWatch(true)" title="Enregistrer dans la liste et regarder">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="currentColor"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>

    <div class="channel-list" id="twitch-list"></div>

  <div class="ch-tooltip" id="ch-tooltip"></div>

            <svg id="icon-mute" viewBox="0 0 24 24" style="display:none"><path d="M16.5 12A4.5 4.5 0 0 0 14 7.97v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06A8.99 8.99 0 0 0 17.73 19l2 2L21 19.73l-18-18zM12 4L9.91 6.09 12 8.18V4z"/></svg>

<div id="emote-tooltip">
  <img id="emote-tooltip-img" src="" alt="">
  <div class="emote-tooltip-name" id="emote-tooltip-name"></div>
</div>

<script>
  let hls = null;
  let _loadToken = 0; // incrémenté à chaque sélection de chaîne, pour ignorer les réponses d'un chargement précédent devenu obsolète
  let _channels    = [];
  let _info        = {};
  let _iptvChannels = []; // [{name, url, logo}]
  let _zeventChannels = []; // [{login, display, amount}]
  let _activeChannel  = null;
  let _activeType     = null; // 'twitch' | 'iptv'
  let _currentIptvIdx = null;
  let _currentTab     = 'twitch';
  let _searchQuery    = '';

  // ── Lien partageable (?ch=<twitch> ou ?tv=<tvg_id>) ─
  const _urlParams       = new URLSearchParams(location.search);
  const _deepLinkChannel = _urlParams.get('ch');
  const _deepLinkIptv    = _urlParams.get('tv');
  const _hasDeepLink     = !!(_deepLinkChannel || _deepLinkIptv);

  function updateUrl(params) {
    const qs = new URLSearchParams(params).toString();
    history.replaceState(null, '', qs ? `?${qs}` : location.pathname);
  }

  // ── Debug ──────────────────────────────────────────
  const _dbg = {
    on: false,
    mode: '—',
    playlist: '—',
    events: [],
    stallCount: 0,
    waitingCount: 0,
    errorCount: 0,
    bufferLen: 0,
    segCount: 0,
    m3u8Raw: null,
    sessionInfo: '',
  };

  function dbgLog(cls, msg) {
    const ts = new Date().toLocaleTimeString('fr-FR', {hour12: false});
    _dbg.events.unshift({ ts, cls, msg });
    if (_dbg.events.length > 12) _dbg.events.pop();
    dbgRender();
  }

  function dbgText() {
    const rows = _dbg.events.map(e => `${e.ts} [${e.cls}] ${e.msg}`).join('\n');
    const si = _dbg.sessionInfo ? _dbg.sessionInfo.replace(/<[^>]*>/g, '') : '';
    const fi = _dbg.fragInProgress
      ? `seg #${_dbg.fragInProgress.sn} en cours depuis ${((Date.now()-_dbg.fragInProgress.t)/1000).toFixed(1)}s` : '';
    return [
      `Mode: ${_dbg.mode}  Playlist: ${_dbg.playlist}`,
      `Buffer: ${_dbg.bufferLen.toFixed(1)}s  Segs: ${_dbg.segCount}`,
      `Stalls: ${_dbg.stallCount}  Waiting: ${_dbg.waitingCount}  Erreurs: ${_dbg.errorCount}`,
      si ? `Speed: ${si}` : '',
      fi ? `Download: ${fi}` : '',
      _dbg.m3u8Raw ? '\n--- M3U8 brut ---\n' + _dbg.m3u8Raw : '',
      '\n--- Événements ---',
      rows,
    ].filter(Boolean).join('\n');
  }

  function dbgRender() {
    if (!_dbg.on) return;
    const rows = _dbg.events.map(e =>
      `<div><span style="color:#666">${e.ts}</span> <span class="dbg-${e.cls}">${e.msg}</span></div>`
    ).join('');
    const m3u8block = _dbg.m3u8Raw
      ? `<hr style="border-color:rgba(255,255,255,0.1);margin:4px 0">
         <div style="color:#888;white-space:pre;overflow-x:auto">${_dbg.m3u8Raw.replace(/</g,'&lt;')}</div>`
      : `<div style="color:#555"><span onclick="dbgFetchM3u8()" style="cursor:pointer;color:#9147ff;text-decoration:underline">↓ charger le m3u8 brut</span></div>`;
    const sessionBlock = _dbg.sessionInfo
      ? `<div style="color:#888;font-size:10px">${_dbg.sessionInfo}</div>` : '';
    const fragBlock = _dbg.fragInProgress
      ? `<div style="color:#e3b341">⏳ seg #${_dbg.fragInProgress.sn} en cours… ${((Date.now()-_dbg.fragInProgress.t)/1000).toFixed(1)}s</div>`
      : '';
    document.getElementById('debug-panel').innerHTML = `
      <div><b>Mode</b> ${_dbg.mode} &nbsp; <b>Playlist</b> ${_dbg.playlist}</div>
      <div><b>Buffer</b> ${_dbg.bufferLen < -5 ? '<span class="dbg-err">désync</span>' : _dbg.bufferLen.toFixed(1)+'s'} &nbsp; <b>Segs reçus</b> ${_dbg.segCount}</div>
      <div><b>Stalls</b> <span class="${_dbg.stallCount ? 'dbg-err' : 'dbg-ok'}">${_dbg.stallCount}</span>
           &nbsp; <b>Waiting</b> <span class="${_dbg.waitingCount ? 'dbg-warn' : 'dbg-ok'}">${_dbg.waitingCount}</span>
           &nbsp; <b>Erreurs</b> <span class="${_dbg.errorCount ? 'dbg-err' : 'dbg-ok'}">${_dbg.errorCount}</span></div>
      ${sessionBlock}${fragBlock}
      ${m3u8block}
      <hr style="border-color:rgba(255,255,255,0.1);margin:4px 0">
      ${rows}
      ${_dbg.errors.length ? `<hr style="border-color:rgba(255,255,255,0.1);margin:4px 0"><div style="color:#ff6b6b;font-size:10px">${_dbg.errors.map(e=>`${e.ts} ${e.msg}`).join('<br>')}</div>` : ''}
      <div style="color:#555;margin-top:2px">D = fermer | sélectionnable</div>
      <button id="debug-copy" onclick="dbgCopy()">📋 Copier tout le debug</button>`;
  }

  async function dbgFetchM3u8() {
    _dbg.m3u8Raw = 'chargement…';
    dbgRender();
    try {
      const r = await fetch('/hls/playlist.m3u8', { cache: 'no-store' });
      _dbg.m3u8Raw = r.ok ? await r.text() : `HTTP ${r.status}`;
    } catch(e) {
      _dbg.m3u8Raw = 'erreur: ' + e.message;
    }
    dbgRender();
  }

  function dbgCopy() {
    navigator.clipboard.writeText(dbgText()).then(() => {
      const btn = document.getElementById('debug-copy');
      if (btn) { btn.textContent = '✓ Copié !'; setTimeout(() => { btn.textContent = '📋 Copier tout le debug'; }, 1500); }
    });
  }

  function dbgToggle() {
    _dbg.on = !_dbg.on;
    document.getElementById('debug-panel').classList.toggle('on', _dbg.on);
    if (_dbg.on) dbgRender();
  }

  // Polling toutes les secondes : buffer + refresh panel (pour le timer download)
  setInterval(() => {
    const v = document.getElementById('video');
    if (v.buffered.length && !v.paused) {
      _dbg.bufferLen = v.buffered.end(v.buffered.length - 1) - v.currentTime;
    }
    if (_dbg.on) dbgRender();
  }, 1000);

  const _favsTwitch = new Set(JSON.parse(localStorage.getItem('twitchoss_favs_twitch') || '[]'));
  const _favsIptv   = new Set(JSON.parse(localStorage.getItem('twitchoss_favs_iptv')   || '[]'));

  function saveFavs() {
    localStorage.setItem('twitchoss_favs_twitch', JSON.stringify([..._favsTwitch]));
    localStorage.setItem('twitchoss_favs_iptv',   JSON.stringify([..._favsIptv]));
  }

  // ── Sélection multiplex (distincte des favoris ★) : chaînes suivies via
  // des vignettes qui se rafraîchissent, dans l'onglet Multiplex ──────
  const _multiplex = new Set(JSON.parse(localStorage.getItem('twitchoss_multiplex') || '[]'));

  function saveMultiplex() {
    localStorage.setItem('twitchoss_multiplex', JSON.stringify([..._multiplex]));
  }

  function toggleMultiplex(ch) {
    if (_multiplex.has(ch)) _multiplex.delete(ch); else _multiplex.add(ch);
    saveMultiplex();
    renderTwitchList();
    renderZeventList();
    renderMultiplexList();
    renderMultiplexGrid();
  }

  function _mpButtonHtml(ch) {
    const on = _multiplex.has(ch);
    return `<button class="mp-btn${on ? ' on' : ''}"
      onclick="event.stopPropagation();toggleMultiplex('${ch}')"
      title="${on ? 'Retirer du multiplex' : 'Ajouter au multiplex'}">
      <svg viewBox="0 0 24 24" width="13" height="13" fill="currentColor"><path d="M4 4h7v7H4V4zm9 0h7v7h-7V4zM4 13h7v7H4v-7zm9 0h7v7h-7v-7z"/></svg>
    </button>`;
  }

  // ── Usage tracking (fait remonter les chaînes qu'on regarde souvent,
  // indépendamment de l'épingle ★ manuelle) ──────────
  const _usageTwitch = JSON.parse(localStorage.getItem('twitchoss_usage_twitch') || '{}');
  const _usageIptv    = JSON.parse(localStorage.getItem('twitchoss_usage_iptv')   || '{}');

  function trackUsage(store, key, storageKey) {
    store[key] = (store[key] || 0) + 1;
    localStorage.setItem(storageKey, JSON.stringify(store));
  }

  // ── Indicateur de débit ────────────────────────────
  function _showSpeedHint(ratio, dl_kbps) {
    const hint = document.getElementById('info-hint');
    hint.innerHTML = '';
    hint.style.color = '';
    if (ratio === null || ratio === undefined) return;
    if (ratio >= 1.5) {
      hint.style.color = '#56d364';
      hint.textContent = `Débit ok (${ratio}x)`;
    } else if (ratio >= 0.85) {
      hint.style.color = '#e3b341';
      hint.textContent = `Débit juste (${ratio}x) — instabilités possibles`;
    } else {
      hint.style.color = '#ff6b6b';
      const lnk = _currentIptvIdx !== null
        ? ` <span onclick="findBetterSource()" style="cursor:pointer;text-decoration:underline">chercher d'autres sources</span>`
        : '';
      hint.innerHTML = `Serveur trop lent (${ratio}x) —${lnk}`;
    }
  }

  async function findBetterSource() {
    if (_currentIptvIdx === null) return;
    const ch     = _iptvChannels[_currentIptvIdx];
    const tvg_id = ch.tvg_id || '';
    const hint   = document.getElementById('info-hint');

    hint.style.color = '#e3b341';
    hint.textContent = 'Recherche dans la base globale iptv-org…';
    dbgLog('ok', `find-sources tvg_id=${tvg_id || '—'} name=${ch.name}`);

    try {
      const params = new URLSearchParams();
      if (tvg_id) params.set('tvg_id', tvg_id);
      params.set('name', ch.name || '');
      const r = await fetch(`/find-sources?${params}`).then(r => r.json());
      if (r.error) { hint.textContent = `Erreur: ${r.error}`; return; }

      const extra   = r.sources || [];
      const current = ch.sources || [];
      const all     = [...new Set([...current, ...extra])];

      if (all.length <= current.length) {
        hint.style.color = '#e3b341';
        hint.textContent = 'Aucune source alternative trouvée';
        return;
      }

      dbgLog('ok', `${extra.length} nouvelles sources (total ${all.length})`);
      hint.textContent = `${extra.length} sources trouvées — speed-test (${all.length} total)…`;
      showOverlay('loading');
      document.getElementById('loading-msg').textContent = `Test de ${all.length} sources…`;

      const result = await fetch('/start-iptv', {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify({ sources: all }),
      }).then(r => r.json());

      if (!result.ok) { showOverlay('error', result.error || 'Flux indisponible'); return; }
      _dbg.mode = result.mode ?? '?';
      dbgLog('ok', `meilleure source: dl=${result.dl_kbps} vid=${result.vid_kbps} ratio=${result.ratio}`);
      if (result.dl_kbps) {
        const ratioColor = result.ratio >= 1.5 ? '#56d364' : result.ratio >= 0.85 ? '#e3b341' : '#ff6b6b';
        _dbg.sessionInfo = `<span style="color:${ratioColor}">dl=${result.dl_kbps}kbps &nbsp; vid=${result.vid_kbps}kbps &nbsp; ratio=${result.ratio}x</span>`;
        _dbg.speedRatio  = result.ratio ?? null;
      }
      _showSpeedHint(result.ratio, result.dl_kbps);

      if (result.ratio !== null && result.ratio < 0.8) {
        dbgLog('err', `meilleure source encore trop lente (${result.ratio}x) — abandon`);
        showOverlay('error', `Aucune source assez rapide (meilleur ratio: ${result.ratio}x)`);
        return;
      }

      const ready = await waitForPlaylist(result.playlist);
      if (!ready) { showOverlay('error', 'Flux indisponible'); return; }
      startHls(result.playlist);

    } catch(e) {
      hint.style.color = '#ff6b6b';
      hint.textContent = `Erreur: ${e.message}`;
    }
  }

  // ── Format helpers ─────────────────────────────────
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function fmtViewers(n) {
    if (n >= 1000) return (n / 1000).toFixed(1).replace(/\.0$/, '') + 'K';
    return String(n);
  }

  function updateInfoBar() {
    const info  = _activeType === 'twitch' ? _info[_activeChannel] : null;
    const title = info?.live && info?.title ? info.title : '';
    document.getElementById('info-title').textContent = title;
    document.getElementById('info-viewers').textContent =
      info?.live && info?.viewers ? `${fmtViewers(info.viewers)} viewers` : '';
  }

  // ── Tabs & search ──────────────────────────────────
  function switchTab(tab) {
    _currentTab  = tab;
    _searchQuery = '';
    document.getElementById('search-input').value = '';
    document.getElementById('tab-twitch').classList.toggle('active', tab === 'twitch');
    document.getElementById('tab-iptv').classList.toggle('active',   tab === 'iptv');
    document.getElementById('tab-zevent').classList.toggle('active', tab === 'zevent');
    document.getElementById('tab-multiplex').classList.toggle('active', tab === 'multiplex');
    document.getElementById('twitch-list').style.display    = tab === 'twitch'    ? '' : 'none';
    document.getElementById('iptv-list').style.display      = tab === 'iptv'      ? '' : 'none';
    document.getElementById('zevent-list').style.display    = tab === 'zevent'    ? '' : 'none';
    document.getElementById('multiplex-list').style.display = tab === 'multiplex' ? '' : 'none';
    document.getElementById('quick-watch').style.display  = tab === 'twitch' ? '' : 'none';

    // La grille de vignettes remplace le lecteur vidéo tant qu'on est sur l'onglet Multiplex.
    document.querySelector('.player-wrapper').style.display = tab === 'multiplex' ? 'none' : '';
    document.getElementById('multiplex-grid').style.display = tab === 'multiplex' ? 'grid' : 'none';
    if (tab === 'multiplex') { _mpRefreshTs = Date.now(); renderMultiplexList(); renderMultiplexGrid(); }
  }

  // ── Quick watch (chaîne pas forcément dans la liste) ─
  async function quickWatch(save) {
    const input = document.getElementById('quick-watch-input');
    const name  = input.value.trim().toLowerCase().replace(/^@/, '');
    if (!name) return;

    if (save) {
      try {
        const r = await fetch('/channels/add', {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify({ channel: name }),
        }).then(r => r.json());
        if (r.error) { alert(r.error); return; }
        _channels = r.channels;
        renderTwitchList();
        refreshChannelInfoOnce();
      } catch {}
    }

    input.value = '';
    selectChannel(name);
  }

  function onSearch(val) {
    _searchQuery = val.toLowerCase();
    if (_currentTab === 'twitch') renderTwitchList();
    else if (_currentTab === 'zevent') renderZeventList();
    else if (_currentTab === 'multiplex') renderMultiplexList();
    else renderIptvList();
  }

  // ── Render: Twitch ─────────────────────────────────
  function _sortLiveViewers(getLogin) {
    return (a, b) => {
      const ia = _info[getLogin(a)], ib = _info[getLogin(b)];
      const diff = (ib?.live ? 1 : 0) - (ia?.live ? 1 : 0);
      if (diff) return diff;
      return (ib?.viewers || 0) - (ia?.viewers || 0);
    };
  }

  function renderTwitchList() {
    const q = _searchQuery;
    const match = ch => !q || ch.toLowerCase().includes(q);

    const favs = _channels.filter(ch => _favsTwitch.has(ch) && match(ch)).sort(_sortLiveViewers(ch => ch));
    const rest  = _channels
      .filter(ch => !_favsTwitch.has(ch) && match(ch))
      .sort(_sortLiveViewers(ch => ch));

    const twitchItem = (ch) => {
      const hue      = [...ch].reduce((a, c) => a + c.charCodeAt(0), 0) % 360;
      const info     = _info[ch];
      const isLive   = info?.live ?? false;
      const isActive = _activeType === 'twitch' && ch === _activeChannel;
      const isFav    = _favsTwitch.has(ch);
      const imgTag   = info?.avatar
        ? `<img src="${info.avatar}" alt="" onerror="this.style.display='none'">`
        : '';
      const viewersStr = isLive && info?.viewers ? `${fmtViewers(info.viewers)} viewers` : '';
      const titleAttr   = isLive && info?.title ? ` data-title="${escapeHtml(info.title)}"` : '';
      const viewersAttr = viewersStr ? ` data-viewers="${escapeHtml(viewersStr)}"` : '';
      const category = isLive && info?.game ? escapeHtml(info.game) : '';
      return `<div class="channel-item${isActive ? ' active' : ''}" data-ch="${ch}" onclick="selectChannel('${ch}')"${titleAttr}${viewersAttr}>
        <div class="avatar" style="background:hsl(${hue},60%,45%)">${ch[0].toUpperCase()}${imgTag}</div>
        <div class="ch-info">
          <span class="ch-name">${ch}</span>
          ${category ? `<span class="ch-meta">${category}</span>` : ''}
          ${viewersStr ? `<span class="ch-meta ch-viewers">${viewersStr}</span>` : ''}
        </div>
        <span class="live-dot${isLive ? ' on' : ''}"></span>
        <button class="star-btn${isFav ? ' pinned' : ''}"
          onclick="event.stopPropagation();toggleFavTwitch('${ch}')"
          title="${isFav ? 'Désépingler' : 'Épingler'}">★</button>
        ${_mpButtonHtml(ch)}
      </div>`;
    };

    let html = '';
    if (favs.length) html += '<div class="section-label">Épinglées</div>' + favs.map(twitchItem).join('');
    if (rest.length) html += (favs.length ? '<div class="section-label">Autres</div>' : '') + rest.map(twitchItem).join('');
    document.getElementById('twitch-list').innerHTML = html || '<div class="list-hint">Aucun résultat</div>';
  }

  // ── Render: ZEvent ─────────────────────────────────
  function fmtAmount(n) {
    return n.toLocaleString('fr-FR') + ' €';
  }

  function renderZeventList() {

  // Choisit automatiquement une chaîne en ligne au chargement de la page :

  // déjà cliqué sur une chaîne pendant le chargement, ou si l'URL pointe

  function autoSelectDefaultChannel() {
    if (_activeChannel || _hasDeepLink) return;
    const liveFavs   = _channels.filter(ch => _favsTwitch.has(ch) && _info[ch]?.live);

  // ── Chat (client IRC Twitch maison + emotes 7TV) ────
  let _chatWs      = null;
  let _chatEmotes  = {};   // nom -> url (7TV, global + salon)
  let _chatChannel = null;
  let _chatRetryTimer = null;

  function escapeHtml(s) {
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  async function loadChatEmotes(channel) {
    _chatEmotes = {};
    try {
      const r = await fetch(`/chat-emotes/${channel}`);
      _chatEmotes = await r.json();
    } catch (e) { /* pas d'emotes 7TV, tant pis */ }
  }

  function parseIrcTags(raw) {
    const tags = {};
    raw.slice(1).split(';').forEach(kv => {
      const idx = kv.indexOf('=');
      tags[kv.slice(0, idx)] = kv.slice(idx + 1);
    });
    return tags;
  }

  function renderChatLine(displayName, color, text, twitchEmotes) {
    let html;
    if (twitchEmotes.length) {
      let cursor = 0;
      html = '';
      for (const em of twitchEmotes) {
        const code = text.slice(em.start, em.end + 1);
        const big  = `https://static-cdn.jtvnw.net/emoticons/v2/${em.id}/default/dark/3.0`;
        html += escapeHtml(text.slice(cursor, em.start));
        html += `<img class="emote" src="https://static-cdn.jtvnw.net/emoticons/v2/${em.id}/default/dark/2.0" alt="${escapeHtml(code)}" data-name="${escapeHtml(code)}" data-big="${big}">`;
        cursor = em.end + 1;
      }
      html += escapeHtml(text.slice(cursor));
    } else {
      html = escapeHtml(text).split(' ').map(word => {
        const url = _chatEmotes[word];
        if (!url) return word;
        const big = url.replace('/2x.webp', '/4x.webp');
        return `<img class="emote" src="${url}" alt="${escapeHtml(word)}" data-name="${escapeHtml(word)}" data-big="${big}">`;
      }).join(' ');
    }
    const row = document.createElement('div');
    row.className = 'chat-msg';
    row.innerHTML = `<span style="color:${color || '#9147ff'};font-weight:700">${escapeHtml(displayName)}</span>: ${html}`;
    return row;
  }

  function handleChatLine(line, list) {
    if (line.startsWith('PING')) { _chatWs.send('PONG :tmi.twitch.tv'); return; }
    if (!line.startsWith('@')) return;
    const sp = line.indexOf(' ');
    const tagPart = line.slice(0, sp);
    const rest    = line.slice(sp + 1);
    if (!rest.includes('PRIVMSG')) return;
    const tags = parseIrcTags(tagPart);
    const sepIdx  = rest.indexOf(' :', rest.indexOf('PRIVMSG'));
    const text    = rest.slice(sepIdx + 2);
    const nickMatch = rest.match(/^:([^!]+)!/);

    let twitchEmotes = [];
    if (tags.emotes) {
      twitchEmotes = tags.emotes.split('/').flatMap(group => {
        const [id, positions] = group.split(':');
        return positions.split(',').map(p => {
          const [start, end] = p.split('-').map(Number);
          return { id, start, end };
        });
      }).sort((a, b) => a.start - b.start);
    }

    const row = renderChatLine(
      tags['display-name'] || (nickMatch ? nickMatch[1] : '?'),
      tags.color,
      text,
      twitchEmotes,
    );
    list.appendChild(row);
    while (list.children.length > 200) list.removeChild(list.firstChild);
    list.scrollTop = list.scrollHeight;
  }

  function connectChat(channel) {
    disconnectChat();
    _chatChannel = channel;
    const list = document.getElementById('chat-messages');
    list.innerHTML = '';
    loadChatEmotes(channel);

    const ws = new WebSocket('wss://irc-ws.chat.twitch.tv:443');
    _chatWs = ws;
    ws.onopen = () => {
      ws.send('CAP REQ :twitch.tv/tags twitch.tv/commands');
      ws.send(`NICK justinfan${Math.floor(10000 + Math.random() * 89999)}`);
      ws.send(`JOIN #${channel}`);
    };
    ws.onmessage = (ev) => {
      ev.data.split('\r\n').filter(Boolean).forEach(line => handleChatLine(line, list));
    };
    ws.onclose = () => {
      if (_chatWs !== ws) return; // fermeture volontaire (changement de salon)
      _chatRetryTimer = setTimeout(() => { if (_chatChannel === channel) connectChat(channel); }, 3000);
    };
  }

  function disconnectChat() {
    clearTimeout(_chatRetryTimer);
    if (_chatWs) { const ws = _chatWs; _chatWs = null; try { ws.close(); } catch(e){} }
    _chatChannel = null;
  }

  function setChatMode(mode, channel) {
    const list   = document.getElementById('chat-messages');
    const noChat = document.getElementById('no-chat');
    if (mode === 'twitch') {
      list.style.display   = 'flex';
      noChat.style.display = 'none';
      document.getElementById('btn-popout-chat').dataset.channel = channel;
      connectChat(channel);
    } else {
      disconnectChat();
      list.style.display   = 'none';
      noChat.style.display = 'flex';
      document.getElementById('btn-popout-chat').dataset.channel = '';
    }
  }

  // ── Infobulle emote (custom, sur les emotes du chat) ─
  (function initEmoteTooltip() {
    const tip     = document.getElementById('emote-tooltip');
    const tipImg  = document.getElementById('emote-tooltip-img');
    const tipName = document.getElementById('emote-tooltip-name');
    const list    = document.getElementById('chat-messages');

    function show(target) {
      tipImg.src = target.dataset.big || target.src;
      tipName.textContent = target.dataset.name || '';
      tip.style.display = 'flex';

      const r = target.getBoundingClientRect();
      tip.style.visibility = 'hidden';
      tip.style.display = 'flex';
      const tw = tip.offsetWidth, th = tip.offsetHeight;
      let left = r.left + r.width / 2 - tw / 2;
      let top  = r.top - th - 10;
      if (top < 4) top = r.bottom + 10;
      left = Math.max(4, Math.min(left, window.innerWidth - tw - 4));
      tip.style.left = `${left}px`;
      tip.style.top  = `${top}px`;
      tip.style.visibility = 'visible';
    }

    function hide() { tip.style.display = 'none'; }

    list.addEventListener('mouseover', (e) => {
      if (e.target.matches && e.target.matches('img.emote')) show(e.target);
    });
    list.addEventListener('mouseout', (e) => {
      if (e.target.matches && e.target.matches('img.emote')) hide();
    });
    list.addEventListener('scroll', hide);
  })();

  // ── Channel selection ──────────────────────────────
  async function selectChannel(channel) {
    // Reclic sur la chaîne déjà active/en cours de chargement : pas la peine de redémarrer le pipeline.
    if (channel === _activeChannel && _activeType === 'twitch') return;

    const token = ++_loadToken;
    _activeChannel = channel;
    _activeType    = 'twitch';
    trackUsage(_usageTwitch, channel, 'twitchoss_usage_twitch');
    renderTwitchList();
    renderZeventList();
    renderMultiplexList();
    renderMultiplexGrid();
    updateUrl({ ch: channel });
    document.getElementById('info-channel').textContent = channel;
    document.getElementById('info-hint').textContent    = '';
    updateInfoBar();
    setLive(false);
    destroyHls();
    showOverlay('loading');
    setChatMode('twitch', channel);
    await fetch(`/start/${channel}`);
    if (token !== _loadToken) return; // une sélection plus récente a pris le relais entre-temps
    document.getElementById('loading-msg').textContent = 'Génération du flux HLS…';
    const ready = await waitForPlaylist('/hls/playlist.m3u8');
    if (token !== _loadToken) return;
    if (!ready) { showOverlay('error', 'Chaîne hors ligne ou timeout'); return; }
    startHls('/hls/playlist.m3u8');
  }

  async function selectIptvChannel(idx) {
    if (_activeType === 'iptv' && _currentIptvIdx === idx) return;

    const token = ++_loadToken;
    const ch = _iptvChannels[idx];
    _activeChannel  = 'iptv:' + idx;
    _activeType     = 'iptv';
    _currentIptvIdx = idx;
    trackUsage(_usageIptv, _iptvKey(ch), 'twitchoss_usage_iptv');
    renderIptvList();
    updateUrl({ tv: ch.tvg_id });
    document.getElementById('info-channel').textContent = ch.name;
    document.getElementById('info-hint').textContent    = '';
    updateInfoBar();
    setLive(false);
    destroyHls();
    showOverlay('loading');
    setChatMode('iptv', null);
    const sources = ch.sources || [];
    const n = sources.length;
    document.getElementById('loading-msg').textContent =
      n > 1 ? `Test des sources (${n})…` : 'Connexion au flux IPTV…';

    const result = await fetch('/start-iptv', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({sources}),
    }).then(r => r.json());

    if (token !== _loadToken) return; // une sélection plus récente a pris le relais entre-temps
    if (!result.ok) { showOverlay('error', result.error || 'Flux indisponible'); return; }
    _dbg.mode = result.mode ?? '?';
    const speedInfo = result.dl_kbps
      ? ` dl=${result.dl_kbps}kbps vid=${result.vid_kbps}kbps ratio=${result.ratio}`
      : '';
    dbgLog('ok', `start-iptv mode=${result.mode}${speedInfo}`);
    if (result.dl_kbps) {
      const ratioColor = result.ratio >= 1.5 ? '#56d364' : result.ratio >= 0.85 ? '#e3b341' : '#ff6b6b';
      _dbg.sessionInfo = `<span style="color:${ratioColor}">dl=${result.dl_kbps}kbps &nbsp; vid=${result.vid_kbps}kbps &nbsp; ratio=${result.ratio}x</span>`;
      _dbg.speedRatio  = result.ratio ?? null;
    }

    // Indicateur de débit dans la barre info
    _showSpeedHint(result.ratio, result.dl_kbps);

    // Si le ratio est franchement insuffisant dès le départ → chercher alternatives immédiatement
    if (result.ratio !== null && result.ratio < 0.8 && _currentIptvIdx !== null) {
      dbgLog('warn', `ratio=${result.ratio} < 0.8 → recherche d'alternatives sans attendre…`);
      document.getElementById('loading-msg').textContent = `Source trop lente (${result.ratio}x) — recherche d'alternatives…`;
      findBetterSource();
      return;
    }

    // ffmpeg doit écrire le premier segment avant que la playlist existe
    const ready = await waitForPlaylist(result.playlist);
    if (token !== _loadToken) return;
    if (!ready) { showOverlay('error', 'Flux indisponible ou timeout'); return; }
    startHls(result.playlist);
  }

  async function waitForPlaylist(path) {
    for (let i = 0; i < 30; i++) {
      try {
        const r = await fetch(`${location.origin}${path}`, { cache: 'no-store' });
        if (r.ok) return true;
      } catch {}
      await new Promise(r => setTimeout(r, 500));
    }
    return false;
  }

  // Les navigateurs bloquent l'autoplay avec le son sans interaction utilisateur
  // (ex: sélection automatique au chargement de la page) -> on retente en muet.
  function attemptAutoplay(video) {
    video.play().catch(e => {
      // NotAllowedError = le navigateur bloque vraiment l'autoplay avec le son (pas d'interaction récente) :
      // on repasse en muet pour que la lecture démarre. Toute autre erreur (ex: AbortError d'un changement
      // de source concurrent) est juste une interruption transitoire — on retente sans toucher au son de
      // l'utilisateur, sinon changer de chaîne le son allumé le coupait à chaque fois.
      if (e.name !== 'NotAllowedError') {
        dbgLog('warn', `play() interrompu (${e.name}) — nouvelle tentative sans changer le son`);
        video.play().catch(e2 => dbgLog('warn', `play() toujours refusé: ${e2.message}`));
        return;
      }
      video.muted = true;
      updateVolumeUI(video);
      video.play().catch(e2 => dbgLog('warn', `play() refusé même en muet: ${e2.message}`));
    });
  }

  function startHls(playlist) {
    const video = document.getElementById('video');
    const src   = `${location.origin}${playlist}`;

    _dbg.playlist     = playlist;
    _dbg.segCount     = 0;
    _dbg.stallCount   = 0;
    _dbg.waitingCount = 0;
    _dbg.errorCount   = 0;
    _dbg.bufferLen    = 0;
    _dbg.m3u8Raw      = null;
    _dbg.events       = [];
    _dbg.errors       = []; // erreurs persistantes, jamais évincées par les events
    _dbg.autoRetried  = false;
    _dbg.fragInProgress = null; // {sn, t}
    // sessionInfo et speedRatio sont préservés (définis avant startHls)
    dbgLog('ok', `startHls → ${playlist}`);

    if (Hls.isSupported()) {
      hls = new Hls({
        liveSyncDurationCount:       2,
        liveMaxLatencyDurationCount: 5,
        maxBufferLength:             30,
        maxMaxBufferLength:          60,
        lowLatencyMode:              false,
        enableWorker:                true,
      });
      hls.loadSource(src);
      hls.attachMedia(video);

      hls.on(Hls.Events.MANIFEST_PARSED, (_, data) => {
        dbgLog('ok', `manifest OK — niveaux: ${data.levels?.length ?? '?'}`);
        showOverlay('none');
        setLive(true);
        attemptAutoplay(video);
      });

      hls.on(Hls.Events.FRAG_LOADING, (_, data) => {
        _dbg.fragInProgress = { sn: data.frag.sn, t: Date.now() };
        dbgLog('ok', `seg #${data.frag.sn} download…`);
      });

      hls.on(Hls.Events.FRAG_LOADED, (_, data) => {
        _dbg.fragInProgress = null;
        _dbg.segCount++;
        const kb = Math.round((data.frag.stats?.loaded ?? 0) / 1024);
        const ms = Math.round(data.frag.stats?.loading?.end - data.frag.stats?.loading?.start);
        dbgLog('ok', `seg #${data.frag.sn} ${kb}KB chargé en ${ms}ms`);
        dbgRender();
      });

      hls.on(Hls.Events.FRAG_BUFFERED, (_, data) => {
        dbgLog('ok', `seg #${data.frag.sn} bufferisé`);
      });

      hls.on(Hls.Events.ERROR, (_, data) => {
        _dbg.errorCount++;
        const fatal = data.fatal ? '[FATAL]' : '[recov]';
        const msg = `${fatal} type=${data.type} detail=${data.details}`;
        dbgLog('err', msg);
        _dbg.errors.push({ ts: new Date().toLocaleTimeString('fr-FR',{hour12:false}), msg });
        if (data.details === Hls.ErrorDetails.FRAG_LOAD_ERROR || data.details === Hls.ErrorDetails.FRAG_LOAD_TIMEOUT)
          dbgLog('err', `  → url: ${data.frag?.url ?? '?'}`);
        if (data.details === Hls.ErrorDetails.MANIFEST_LOAD_ERROR || data.details === Hls.ErrorDetails.MANIFEST_LOAD_TIMEOUT)
          dbgLog('err', `  → manifest HTTP ${data.response?.code ?? '?'} url: ${data.context?.url ?? '?'}`);
        if (data.details === 'bufferStalledError' && !data.fatal
            && _activeType === 'iptv' && _currentIptvIdx !== null
            && !_dbg.autoRetried) {
          const badRatio = _dbg.speedRatio !== null && _dbg.speedRatio < 0.8;
          if (_dbg.segCount <= 2 || (badRatio && _dbg.segCount <= 15)) {
            _dbg.autoRetried = true;
            dbgLog('warn', `source trop lente (ratio=${_dbg.speedRatio ?? '?'}) — recherche auto…`);
            setTimeout(findBetterSource, 1500);
          }
        }
        if (data.fatal) { showOverlay('error', 'Erreur de lecture'); setLive(false); }
      });

      hls.on(Hls.Events.BUFFER_STALLED, () => {
        _dbg.stallCount++; dbgLog('err', 'HLS: buffer stalled');
      });

    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
      video.src = src;
      video.addEventListener('loadedmetadata', () => {
        showOverlay('none');
        setLive(true);
        attemptAutoplay(video);
      }, { once: true });
    } else {
      showOverlay('error', 'Navigateur non supporté');
    }
  }

  // ── Controls ───────────────────────────────────────
  function togglePlay() {
    const v = document.getElementById('video');
    if (v.paused) v.play(); else v.pause();
  }

  function toggleMute() {
    const v = document.getElementById('video');
    v.muted = !v.muted;
    updateVolumeUI(v);
  }

  function setVolume(val) {
    const v = document.getElementById('video');
    v.volume = val;
    v.muted  = (val == 0);
    updateVolumeUI(v);
  }

  function updateVolumeUI(v) {
    const muted = v.muted || v.volume === 0;
    document.getElementById('icon-vol').style.display  = muted ? 'none' : '';
    document.getElementById('icon-mute').style.display = muted ? '' : 'none';
    if (!muted) document.getElementById('volume-slider').value = v.volume;
  }

  function updatePlayUI(v) {
    document.getElementById('icon-play').style.display  = v.paused ? '' : 'none';
    document.getElementById('icon-pause').style.display = v.paused ? 'none' : '';
  }

  document.getElementById('video').addEventListener('play',  () => updatePlayUI(document.getElementById('video')));
  document.getElementById('video').addEventListener('pause', () => updatePlayUI(document.getElementById('video')));

  // Attachés une seule fois : le <video> est réutilisé d'une chaîne à l'autre
  // (le re-attacher à chaque startHls() empilait les listeners indéfiniment).
  document.getElementById('video').addEventListener('waiting', () => {
    _dbg.waitingCount++; dbgLog('warn', 'video: waiting (rebuffering)');
  });
  document.getElementById('video').addEventListener('stalled', () => {
    _dbg.stallCount++; dbgLog('err', 'video: stalled');
  });
  document.getElementById('video').addEventListener('canplay', () => dbgLog('ok', 'video: canplay'));
  document.getElementById('video').addEventListener('error', () => {
    const v = document.getElementById('video');
    _dbg.errorCount++; dbgLog('err', `video: error ${v.error?.code} ${v.error?.message}`);
  });

  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT') return;
    const v = document.getElementById('video');
    if (e.code === 'Space')     { e.preventDefault(); togglePlay(); }
    if (e.code === 'KeyM')      { toggleMute(); }
    if (e.code === 'KeyD')      { dbgToggle(); }
    if (e.code === 'ArrowUp')   { e.preventDefault(); setVolume(Math.min(1, v.volume + 0.1)); }
    if (e.code === 'ArrowDown') { e.preventDefault(); setVolume(Math.max(0, v.volume - 0.1)); }
    if (e.code === 'KeyF')      { toggleFullscreen(); }
    if (e.code === 'KeyT')      { toggleCinemaMode(); }
  });

  // ── Cinema mode ────────────────────────────────────
  let _cinemaMode = false;
  function toggleCinemaMode() {
    _cinemaMode = !_cinemaMode;
    document.querySelector('.app').classList.toggle('cinema-mode', _cinemaMode);
    document.getElementById('btn-cinema').classList.toggle('active', _cinemaMode);
  }

  // ── Fullscreen ─────────────────────────────────────
  function toggleFullscreen() {
    const el = document.querySelector('.player-wrapper');
    const isFs = document.fullscreenElement || document.webkitFullscreenElement;
    if (isFs) {
      (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    } else {
      (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
    }
  }

  function updateFsUI() {
    const isFs = document.fullscreenElement || document.webkitFullscreenElement;
    document.getElementById('icon-fs-enter').style.display = isFs ? 'none' : '';
    document.getElementById('icon-fs-exit').style.display  = isFs ? ''     : 'none';
  }

  document.addEventListener('fullscreenchange',       updateFsUI);
  document.addEventListener('webkitfullscreenchange', updateFsUI);

  function popoutChat() {
    const ch = document.getElementById('btn-popout-chat').dataset.channel;
    if (ch) window.open(`https://www.twitch.tv/popout/${ch}/chat?popout=`, '_blank', 'width=340,height=700');
  }

  // ── Tooltip custom (titre du stream au hover) ───────
  function setupChannelTooltip() {
    const tooltip = document.getElementById('ch-tooltip');
    ['twitch-list', 'zevent-list'].forEach(id => wireChannelTooltip(document.getElementById(id), tooltip));
  }

  function wireChannelTooltip(list, tooltip) {
    list.addEventListener('mouseover', (e) => {
      const item = e.target.closest('.channel-item');
      if (!item || !item.dataset.title) return;
      const rect = item.getBoundingClientRect();
      tooltip.innerHTML = '';
      const titleEl = document.createElement('div');
      titleEl.textContent = item.dataset.title;
      tooltip.appendChild(titleEl);
      if (item.dataset.viewers) {
        const viewersEl = document.createElement('div');
        viewersEl.className = 'ch-tooltip-viewers';
        viewersEl.textContent = item.dataset.viewers;
        tooltip.appendChild(viewersEl);
      }
      tooltip.style.left = `${rect.right + 8}px`;
      tooltip.style.top  = `${rect.top + rect.height / 2}px`;
      tooltip.classList.add('on');
    });

    list.addEventListener('mouseout', (e) => {
      const item = e.target.closest('.channel-item');
      if (!item || item.contains(e.relatedTarget)) return;
      tooltip.classList.remove('on');
    });

    list.addEventListener('scroll', () => tooltip.classList.remove('on'));
  }

  // ───────────────────────────────────────────────────
  setupChannelTooltip();
  loadChannels();
  loadIptvChannels();
  loadZeventChannels();
  showOverlay('idle');
</script>
</body>
</html>
